# System user for deploy/systemd/vm-manager.service. QEMU and swtpm run as
# transient units of this user's own service manager (loginctl
# enable-linger vm-manager), outside the unit's SupplementaryGroups=, so
# the kvm membership must come from the user database for /dev/kvm and
# /dev/vhost-vsock.
#Type Name        ID  GECOS                         Home directory        Shell
u     vm-manager  -   "vm-manager VM provisioner"   /var/lib/vm-manager   -
m     vm-manager  kvm
