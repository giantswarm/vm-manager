suite: deprecated Dex private URL setting
templates:
  - templates/deployment.yaml
set:
  oauth.enabled: true
  oauth.baseURL: https://manager.example.test
  oauth.dex.issuerURL: https://dex.example.test
  oauth.dex.clientID: manager
  oauth.existingSecret: manager-oauth
tests:
  - it: still renders and passes the deprecated flag when allowPrivateURLs is true
    set:
      oauth.dex.allowPrivateURLs: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --allow-private-oauth-urls=true
  - it: omits the deprecated flag by default
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].args
          content: --allow-private-oauth-urls=true
  - it: still renders and passes the deprecated JWKS flag when sso.allowPrivateIPs is true
    set:
      oauth.sso.allowPrivateIPs: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --sso-allow-private-ips=true
  - it: omits the deprecated JWKS flag by default
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].args
          content: --sso-allow-private-ips=true
