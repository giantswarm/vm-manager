{{- if .Values.muster.mcpServer.enabled }}
{{- /*
Registers this server with muster. Tools appear as x_<name>_<tool>. With
oauth.enabled the CR carries the auth block: muster forwards the session's IdP
id_token (forwardToken), which this server validates through its trusted
audiences, and requests the requiredAudiences at login. Without OAuth muster
connects anonymously.
*/}}
apiVersion: muster.giantswarm.io/v1alpha1
kind: MCPServer
metadata:
  name: {{ .Values.muster.mcpServer.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- /*
    agent-platform.giantswarm.io/tool-group puts this server into the platform's
    Agent Platform tier (the MCP servers page, the `agent-platform` toolset
    preset), next to agent-manager and model-manager. muster.mcpServer.labels
    is merged last, so it can add or override any of these.
    */}}
    {{- $labels := dict "muster.giantswarm.io/type" "vm-manager" "agent-platform.giantswarm.io/tool-group" "agent-platform" }}
    {{- $labels = mergeOverwrite $labels (include "vm-manager.labels" . | fromYaml) (default (dict) .Values.muster.mcpServer.labels) }}
    {{- toYaml $labels | nindent 4 }}
spec:
  autoStart: {{ .Values.muster.mcpServer.autoStart }}
  type: streamable-http
  url: http://{{ include "vm-manager.fullname" . }}.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.service.port }}{{ .Values.mcp.path }}
  {{- with .Values.muster.mcpServer.description }}
  description: {{ . | quote }}
  {{- end }}
  {{- if .Values.oauth.enabled }}
  auth:
    type: oauth
    forwardToken: {{ .Values.muster.mcpServer.auth.forwardToken }}
    {{- with .Values.muster.mcpServer.auth.requiredAudiences }}
    requiredAudiences:
      {{- toYaml . | nindent 6 }}
    {{- end }}
  {{- end }}
{{- end }}
