{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "vm-manager.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vm-manager.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "vm-manager.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector: {}
        {{- range .Values.networkPolicy.ingressNamespaces }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . }}
        {{- end }}
      ports:
        - protocol: TCP
          port: 8080
  egress:
    {{- if .Values.networkPolicy.guestEgress }}
    # The guests' traffic: userspace NAT out of this pod, so every destination.
    - {}
    {{- else }}
    # DNS
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    {{- if .Values.oauth.enabled }}
    # The identity provider (discovery, JWKS).
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 5556
    {{- end }}
    {{- end }}
{{- end }}
