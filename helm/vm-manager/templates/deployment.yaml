apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "vm-manager.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vm-manager.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  {{- /*
  Recreate: the VMs are children of the one process, the state directory is
  the pod's own and the devices are the node's — two pods at once would fight
  over all three.
  */}}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "vm-manager.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "vm-manager.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "vm-manager.serviceAccountName" . }}
      {{- /* vm-manager calls no Kubernetes API. */}}
      automountServiceAccountToken: false
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- /* Guests power down on SIGTERM (--stop-timeout each); give the pod room for them. */}}
      terminationGracePeriodSeconds: 90
      {{- if .Values.guestImage.enabled }}
      {{- /*
      The guest image is a published artifact, fetched into the state volume
      before the server starts; a directory that already holds the referenced
      digest is left alone, golden PCR values recorded into its policy.json
      included. Unprivileged: it only writes files.
      */}}
      initContainers:
        - name: guest-image
          image: "{{ .Values.image.registry }}/{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - image
            - pull
            - {{ include "vm-manager.guestImageRef" . }}
            - --image-dir={{ include "vm-manager.imageDir" . }}
            {{- if .Values.guestImage.plainHTTP }}
            - --plain-http
            {{- end }}
          {{- if .Values.guestImage.pullSecret }}
          env:
            - name: DOCKER_CONFIG
              value: /etc/vm-manager/registry
          {{- end }}
          securityContext:
            {{- /* Root like the server that reads what it writes; nothing else. */}}
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            {{- toYaml .Values.guestImage.resources | nindent 12 }}
          volumeMounts:
            - name: state
              mountPath: {{ include "vm-manager.stateDir" . }}
            {{- if .Values.guestImage.pullSecret }}
            - name: registry-config
              mountPath: /etc/vm-manager/registry
              readOnly: true
            {{- end }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.registry }}/{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - serve
            - --listen=:8080
            {{- /*
            No service manager in the pod: QEMU and swtpm are plain children
            of vm-manager and end with it (a pod restart stops the VMs; their
            records and disks survive on a persistent state claim).
            */}}
            - --launcher=process
            - --state-dir={{ include "vm-manager.stateDir" . }}
            - --image-dir={{ include "vm-manager.imageDir" . }}
            - --mcp-path={{ .Values.mcp.path }}
            - --network-subnet={{ .Values.vm.networkSubnet }}
            - --default-network={{ .Values.vm.defaultNetwork }}
            - --install-timeout={{ .Values.vm.installTimeout }}
            - --boot-timeout={{ .Values.vm.bootTimeout }}
            - --stop-timeout={{ .Values.vm.stopTimeout }}
            - --attestation={{ .Values.vm.attestation }}
            {{- if .Values.vm.learnGolden }}
            - --attestation-learn-golden=true
            {{- end }}
            {{- with .Values.vm.ovmf.code }}
            - --ovmf-code={{ . }}
            {{- end }}
            {{- with .Values.vm.ovmf.vars }}
            - --ovmf-vars={{ . }}
            {{- end }}
            - --metrics-enabled={{ .Values.metrics.enabled }}
            - --metrics-guest-series-limit={{ .Values.metrics.guestSeriesLimit }}
            {{- if .Values.oauth.enabled }}
            - --enable-oauth=true
            - --oauth-base-url={{ include "vm-manager.oauthBaseURL" . }}
            - --oauth-provider={{ .Values.oauth.provider }}
            {{- with include "vm-manager.oauthTrustedAudiences" . }}
            - --oauth-trusted-audiences={{ . }}
            {{- end }}
            {{- if .Values.oauth.sso.allowPrivateIPs }}
            - --sso-allow-private-ips=true
            {{- end }}
            {{- if .Values.oauth.allowPublicClientRegistration }}
            - --allow-public-client-registration=true
            {{- end }}
            {{- if eq .Values.oauth.provider "dex" }}
            - --dex-issuer-url={{ include "vm-manager.oauthDexIssuerURL" . }}
            - --dex-client-id={{ include "vm-manager.oauthDexClientID" . }}
            {{- if .Values.oauth.dex.allowPrivateURLs }}
            - --allow-private-oauth-urls=true
            {{- end }}
            {{- if include "vm-manager.oauthDexCASecretName" . }}
            - --dex-ca-file=/etc/vm-manager/idp-ca/{{ include "vm-manager.oauthDexCASecretKey" . }}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- if .Values.logging.verbose }}
            - --verbose
            {{- end }}
            {{- with .Values.extraArgs }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- if or .Values.oauth.enabled .Values.extraEnv }}
          env:
            {{- if .Values.oauth.enabled }}
            {{- if eq .Values.oauth.provider "google" }}
            {{- if .Values.oauth.google.clientID }}
            - name: GOOGLE_CLIENT_ID
              value: {{ .Values.oauth.google.clientID | quote }}
            {{- else }}
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "vm-manager.oauthSecretName" . }}
                  key: google-client-id
            {{- end }}
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "vm-manager.oauthSecretName" . }}
                  key: google-client-secret
            {{- else }}
            - name: DEX_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "vm-manager.oauthSecretName" . }}
                  key: dex-client-secret
            {{- end }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- $idpCA := "" }}
          {{- if and .Values.oauth.enabled (eq .Values.oauth.provider "dex") }}{{ $idpCA = include "vm-manager.oauthDexCASecretName" . }}{{ end }}
          volumeMounts:
            {{- /* The image directory is <state>/images: one volume, the guest image and its golden values persist with the state. */}}
            - name: state
              mountPath: {{ include "vm-manager.stateDir" . }}
            - name: tmp
              mountPath: /tmp
            {{- if $idpCA }}
            - name: idp-ca
              mountPath: /etc/vm-manager/idp-ca
              readOnly: true
            {{- end }}
      volumes:
        - name: state
          {{- with include "vm-manager.stateClaim" . }}
          persistentVolumeClaim:
            claimName: {{ . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: tmp
          emptyDir: {}
        {{- if and .Values.guestImage.enabled .Values.guestImage.pullSecret }}
        - name: registry-config
          secret:
            secretName: {{ .Values.guestImage.pullSecret }}
            items:
              - key: .dockerconfigjson
                path: config.json
        {{- end }}
        {{- if $idpCA }}
        - name: idp-ca
          secret:
            secretName: {{ $idpCA }}
            items:
              - key: {{ include "vm-manager.oauthDexCASecretKey" . }}
                path: {{ include "vm-manager.oauthDexCASecretKey" . }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
