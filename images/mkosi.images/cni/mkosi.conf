# cni: systemd-sysext DDI with the plugins of one CNI release for
# giantswarm-vm-base, one image per release (decision: a CNI bump rebuilds
# this extension only, never a kubernetes one). Built like the kubernetes
# sysext: an overlay on the base OS tree, so only the delta is packed, erofs
# (zstd) with dm-verity, signed with the verity key of the base image. The
# image version is "<cni>-<release>" (mkosi.version prints CNI_VERSION from
# the Makefile); the content is the tree scripts/fetch-cni-plugins stages
# from the entry cni/<cni>: the plugin binaries in /usr/lib/cni, the one
# directory containerd's bin_dirs lists (kubernetes/mkosi.extra/usr/lib/
# vm-manager/containerd.toml), next to the reference plugins of the
# kubernetes sysext.
[Config]
Dependencies=base

[Output]
Format=sysext
ImageId=cni
Overlay=yes
# cni_<v>.roothash next to cni_<v>.raw; scripts/verify-sysext compares it
# with the signature partition.
SplitArtifacts=roothash

[Build]
# As the kubernetes sysext: for the booted system only, and compressed.
Environment=SYSEXT_SCOPE=system
Environment=SYSTEMD_REPART_MKFS_OPTIONS_EROFS="-zzstd -Ededupe"

[Content]
BaseTrees=%O/base
Bootable=no
# Staged per release by the Makefile (cni-plugins); fetch-cni-plugins
# recreates it, so it holds exactly the plugins of CNI_VERSION.
ExtraTrees=../../build/cni/tree:/

[Validation]
Verity=signed
SignExpectedPcr=no
