# kubernetes: systemd-sysext DDI with the Kubernetes node stack for
# giantswarm-vm-base. Built as an overlay on the base OS tree, so only the
# delta (the packages below plus mkosi.extra/) is packed: erofs (zstd) with
# dm-verity, signed with the verity key of the base image (VerityKey= and
# VerityCertificate= are universal mkosi settings inherited from ../../
# mkosi.conf). The image version is the Kubernetes version (mkosi.version, an
# executable printing KUBERNETES_VERSION from the Makefile); the node
# packages are pinned to it below and mkosi.postinst refuses to build when
# the installed kubeadm differs anyway.
[Config]
Dependencies=base

[Output]
Format=sysext
ImageId=kubernetes
Overlay=yes
# kubernetes_<v>.roothash next to kubernetes_<v>.raw; scripts/verify-kubernetes
# compares it with the signature partition.
SplitArtifacts=roothash

[Build]
# SYSEXT_SCOPE: for the booted system only (mkosi's default "initrd system
# portable" would also offer the extension to initrds and portable services).
# SYSTEMD_REPART_MKFS_OPTIONS_EROFS: mkosi's built-in sysext repart definitions
# carry no Compression=, which would ship the Go binaries uncompressed (550 MB).
# mkosi hands the variable to systemd-repart, which appends it to mkfs.erofs.
Environment=SYSEXT_SCOPE=system
Environment=SYSTEMD_REPART_MKFS_OPTIONS_EROFS="-zzstd -Ededupe"

[Content]
BaseTrees=%O/base
Bootable=no
Packages=
        # node components, pinned to the image version. The official
        # repositories carry one Kubernetes release; the Makefile downloads
        # the release's builds from the Arch Linux Archive into build/pkgs/%v
        # and hands the directory to mkosi as a local repository that pacman
        # consults first (--volatile-package-directory=). A version the local
        # repository lacks fails here instead of building whatever the
        # repositories offer.
        kubeadm=%v
        kubelet=%v
        kubectl=%v
        # container runtime, CRI CLI, reference CNI plugins (/usr/lib/cni)
        containerd
        runc
        crictl
        cni-plugins
        # kubeadm preflight and kube-proxy dependencies (Arch's iptables is the
        # nft-based variant; iptables-legacy is the other package)
        conntrack-tools
        socat
        ethtool
        iptables

[Validation]
Verity=signed
SignExpectedPcr=no
