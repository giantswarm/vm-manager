# Kernel modules of containerd's EROFS snapshotter and differ
# (/usr/lib/vm-manager/containerd.toml): each image layer is an EROFS file
# system on a loop device behind a signed dm-verity device. The modules are
# the base root's; containerd.service.d/10-vm-manager.conf loads this list
# before containerd starts.
erofs
dm_verity
loop
