# containerd.service is upstream's unit of the shipped release
# (scripts/fetch-containerd). It reads /etc/containerd/config.toml by default;
# an extension cannot ship /etc, so point it at the configuration inside the
# extension.
#
# The EROFS snapshotter and differ need erofs, dm_verity and loop
# (modules-load.d/containerd.conf of this extension, the modules are the base
# root's). systemd-modules-load ran at boot, before vm-kubernetes.service
# merged the extension; the unit restarts it, but the Upholds= start of
# containerd after the merge's daemon-reload can come first, so containerd
# loads the list itself.
[Service]
ExecStartPre=/usr/lib/systemd/systemd-modules-load /usr/lib/modules-load.d/containerd.conf
ExecStart=
ExecStart=/usr/bin/containerd --config /usr/lib/vm-manager/containerd.toml
