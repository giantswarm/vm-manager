# Start the node stack whenever multi-user.target is up. A preset or [Install]
# symlink cannot do that for an extension merged during boot: the boot
# transaction is computed before systemd-sysext.service runs, and the wants
# directories of the extension live in the read-only /usr. Upholds= is
# evaluated after the daemon-reload the extension requests
# (EXTENSION_RELOAD_MANAGER=1) and also restarts the units should they stop.
[Unit]
Upholds=containerd.service kubelet.service
