# Arch's kubelet.service sources $KUBELET_ARGS from /etc/kubernetes/kubelet.env,
# which an extension cannot ship; the vm-manager defaults live here instead
# (10-kubeadm.conf from the kubeadm package appends $KUBELET_ARGS last).
# kubeadm writes everything else to /var/lib/kubelet/kubeadm-flags.env and
# /var/lib/kubelet/config.yaml. Until "kubeadm init/join" ran, kubelet exits
# and is restarted every 10 s (RestartSec=); that is expected.
[Unit]
Wants=network-online.target containerd.service
After=network-online.target containerd.service

[Service]
Environment=KUBELET_ARGS=--container-runtime-endpoint=unix:///run/containerd/containerd.sock
