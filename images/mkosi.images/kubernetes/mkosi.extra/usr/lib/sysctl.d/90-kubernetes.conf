# Bridged pod traffic through iptables/nftables and IPv6 forwarding
# (net.ipv4.ip_forward is set by 50-kubelet.conf of the kubelet package,
# br_netfilter is loaded through modules-load.d/kubelet.conf of the same
# package). Applied by systemd-sysctl.service, which the base image orders
# after systemd-sysext.service.
net.bridge.bridge-nf-call-iptables = 1
net.bridge.bridge-nf-call-ip6tables = 1
net.ipv6.conf.all.forwarding = 1
