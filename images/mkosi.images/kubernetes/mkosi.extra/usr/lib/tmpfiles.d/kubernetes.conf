# Directories the node stack expects. /var/lib/kubelet, /etc/kubernetes and
# /run/kubelet are created by kubelet.service (StateDirectory=,
# ConfigurationDirectory=, RuntimeDirectory=), /var/lib/containerd by containerd.
# The CNI DaemonSet writes its configuration to /etc/cni/net.d and installs its
# binaries into /opt/cni/bin (both writable per boot: systemd.volatile=overlay).
d /etc/cni/net.d 0755 root root -
d /opt/cni/bin 0755 root root -
