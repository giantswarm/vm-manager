# The OS tree of giantswarm-vm-base. Built as a directory so the main disk
# image (../../mkosi.conf) and future extension subimages (kubernetes sysext:
# BaseTrees=%O/base, Overlay=yes) share exactly the same base.
[Output]
Format=directory
Output=base
# Keep vmlinuz inside the tree; the main image builds the UKI from it.
SplitArtifacts=

[Content]
Bootable=no
# vm-agent (attestation) from `make agent` (build/agent/tree, see Makefile);
# the same tree goes into the initrd (../../mkosi.initrd.conf/mkosi.conf).
ExtraTrees=../../build/agent/tree:/
# Keep the pacman database so images built on top of this tree can install
# additional packages; the main image strips it (CleanPackageMetadata=yes).
CleanPackageMetadata=no
Packages=
        # OS
        systemd
        systemd-sysvcompat
        dbus-broker-units
        linux
        bash
        coreutils
        util-linux
        procps-ng
        kbd
        # every tool the scripts in mkosi.extra/usr/lib/vm-manager/ call is
        # listed, never left to a transitive dependency the Arch repositories
        # may drop: kubernetes matches systemd-imds errors with grep
        grep
        # dlopen()ed by systemd: TPM (creds, pcrextend, cryptenroll), HTTP
        # (systemd-imdsd, systemd-pull for sysupdate), tar imports
        tpm2-tss
        curl
        libarchive
        # systemd-pull verifies SHA256SUMS.gpg by executing gpg
        gnupg
        # sysinstall/repart create ESP and var on the target disk
        dosfstools
        e2fsprogs
        # decompressors for sysupdate transfers
        xz
        zstd
        # network + ssh (systemd-ssh-generator exposes sshd over AF_VSOCK)
        openssh
        iproute2
        iputils
