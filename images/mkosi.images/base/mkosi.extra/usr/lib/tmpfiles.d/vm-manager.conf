# Target directory of the kubernetes sysupdate component (systemd-sysext merges
# images found here).
d /var/lib/extensions 0755 root root -

# /var is empty in the image (RemoveFiles=/var/* in mkosi.conf, so that
# systemd-gpt-auto-generator mounts the var partition over it). What packages
# ship there and systemd's own tmpfiles catalog does not recreate:
# sshd's privilege separation directory, the lock symlink, and the journal
# directory so that logs persist on var (journald Storage=auto).
d /var/empty 0755 root root -
L /var/lock - - - - ../run/lock
d /var/log/journal 2755 root systemd-journal -
