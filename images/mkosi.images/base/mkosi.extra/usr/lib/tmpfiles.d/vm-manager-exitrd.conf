# The exit initrd ("exitrd") of systemd-shutdown(8), see bootup(7): when
# /run/initramfs/shutdown exists, systemd-shutdown, after it has killed every
# process and unmounted what it can, pivots into /run/initramfs with the old
# root at /oldroot and executes /shutdown there.
#
# Why the installed system needs one: the /etc overlay (upper directory on the
# var partition, mounted by the initrd) cannot be unmounted by systemd-shutdown
# itself. glibc keeps /etc/ld.so.cache mmap'd for the lifetime of every
# process, and a mapping through overlayfs pins the overlay mount (the backing
# file keeps the user-visible path since Linux 6.6). PID 1 is the process that
# survives, so its own mapping is what makes "umount /etc" fail with EBUSY
# without any open file, and while the overlay exists it keeps the ext4 of var
# mounted (and its journal dirty) through power-off. The Kubernetes sysext
# adds a second such pin: its overlay on /usr has the image on var as a lower
# layer (loop device plus verity), and PID 1 runs from that overlay. Exec'ing
# a fresh systemd-shutdown from a root that has no /etc/ld.so.cache and whose
# /usr is the image's own (run-initramfs-{root,usr}.mount) drops both
# mappings; that instance's unmount loop releases the overlays. The rest is
# the kernel's, and asynchronous: the sysext's dm-verity and loop devices go
# away on workqueues once the /usr overlay is gone, and only then is the
# image file on var closed and var's superblock put; system-shutdown/
# vm-manager-var waits for that before systemd-shutdown syncs and powers off,
# so that the next boot's fsck finds var clean instead of replaying the
# journal.
#
# The exitrd borrows the old root's binaries and libraries through the /usr
# bind mount; the ELF interpreter path /lib64 points at it, /shutdown
# re-executes systemd-shutdown with the arguments it was given, and
# /etc/initrd-release makes in_initrd() true so that the second instance does
# not pivot again.
d /run/initramfs 0755 root root -
d /run/initramfs/etc 0755 root root -
f /run/initramfs/etc/initrd-release 0644 root root -
L /run/initramfs/lib64 - - - - usr/lib
f /run/initramfs/shutdown 0755 root root - #!/usr/bin/sh\nexec /usr/lib/systemd/systemd-shutdown "$@"\n
