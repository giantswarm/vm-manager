# Boot-time systemd-repart on the root disk. systemd-sysinstall creates the
# ESP, the A slots and var from ../repart.sysinstall.d but defers every
# Label=_empty partition (--defer-partitions-empty), reserving their space;
# the installed system's first boot creates the B slots from here. This file
# and 11-/12- only claim the existing A slots (matching is by type, in
# definition order) so that 20-/21-/22- create the B slots; they carry no
# size so that a plain boot of the base image, whose partitions cannot grow,
# is left alone.
[Partition]
Type=root
