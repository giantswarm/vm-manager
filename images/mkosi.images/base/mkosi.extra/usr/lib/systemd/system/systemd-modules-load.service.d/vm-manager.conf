# System extensions (the kubernetes sysext) bring modules-load.d/ and sysctl.d/
# entries. Upstream orders neither systemd-modules-load.service nor
# systemd-sysctl.service after systemd-sysext.service, so without this they can
# run before the extension is merged. Everything needed to get this far is
# loaded by the initrd (KernelInitrdModules= in mkosi.conf).
[Unit]
After=systemd-sysext.service
