# /etc is volatile (systemd.volatile=overlay): the static hostname that
# systemd-firstboot writes from the firstboot.hostname credential never reaches
# PID 1, which read /etc/hostname before firstboot ran, and the file is gone
# again by the next boot. Apply it to the running kernel as well, so that the
# hostname is right from the first boot on without a separate system.hostname
# credential.
[Service]
ExecStartPost=-/bin/sh -c 'read -r h </etc/hostname && printf "%%s" "$h" >/proc/sys/kernel/hostname'
