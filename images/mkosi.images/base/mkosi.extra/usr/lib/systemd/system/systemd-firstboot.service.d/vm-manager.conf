# First boot only (/etc persists from then on and PID 1 reads /etc/hostname
# itself): the static hostname that systemd-firstboot writes from the
# firstboot.hostname credential is not seen by PID 1, which read /etc/hostname
# before firstboot ran. Apply it to the running kernel as well, so that the
# first boot already carries the right hostname without a separate
# system.hostname credential.
[Service]
ExecStartPost=-/bin/sh -c 'read -r h </etc/hostname && printf "%%s" "$h" >/proc/sys/kernel/hostname'
