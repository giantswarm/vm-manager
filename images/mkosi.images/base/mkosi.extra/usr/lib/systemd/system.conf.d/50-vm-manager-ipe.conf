# Lock the IPE policy for the rest of the boot. PID 1 loads and activates
# /run/ipe/giantswarm-vm.p7b, which the initrd put there, before it applies
# this bounding set; from then on
# no process, root and privileged containers included, holds CAP_MAC_ADMIN,
# which every write below /sys/kernel/security/ipe/ needs: nobody can switch
# enforcement off, load another policy or activate one. The processes the
# kernel starts itself (usermode helpers) lose it through
# kernel.usermodehelper.bset on the UKI command line. The initrd pins
# /etc/systemd/system.conf{,.d} to the image (persistent-etc), so an /etc drop-in
# cannot hand the capability back on the next boot either.
[Manager]
CapabilityBoundingSet=~CAP_MAC_ADMIN
