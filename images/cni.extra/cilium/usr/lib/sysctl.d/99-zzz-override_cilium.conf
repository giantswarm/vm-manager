# What the apply-sysctl-overwrites init container of the Cilium chart would
# write to /etc/sysctl.d/99-zzz-override_cilium.conf through cilium-sysctlfix,
# a binary it copies to the host's cni.binPath, which IPE refuses to execute
# (sysctlfix.enabled=false on these nodes). The keys and the file name are
# cilium-sysctlfix's of the Cilium release of this sysext
# (tools/sysctlfix/main.go). vm-kubernetes restarts systemd-sysctl.service
# after the merge, and systemd's udev rule applies the lxc* and cilium_* keys
# to every link the agent creates later.

# Disable rp_filter on Cilium interfaces since it may cause mangled packets to be dropped
-net.ipv4.conf.lxc*.rp_filter = 0
-net.ipv4.conf.cilium_*.rp_filter = 0
# The kernel uses max(conf.all, conf.{dev}) as its value, so we need to set .all. to 0 as well.
# Otherwise it will overrule the device specific settings.
net.ipv4.conf.all.rp_filter = 0
