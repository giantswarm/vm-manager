# Extra configuration for the default mkosi initrd (on top of InitrdProfiles=network).
# systemd-imds-generator only pulls systemd-imdsd/-early-network/-import into the
# initrd transaction when hwdb knows the DMI modalias, so the giantswarm provider
# record must be compiled into the initrd's hwdb.bin as well.
[Content]
ExtraTrees=../mkosi.images/base/mkosi.extra/usr/lib/udev/hwdb.d:/usr/lib/udev/hwdb.d
PostInstallationScripts=../scripts/hwdb-update
