# vm-manager: the fetch stage reads /user-data, which the IMDS releases only
# after the initrd-stage attestation quote verified (503 + Retry-After until
# then). Pull the agent in and wait for it; a failed quote does not stop the
# fetch (Wants=, not Requires=): Ignition then retries against the 503 and the
# rejection is what the console and get_vm_attestation show.
[Unit]
Wants=vm-agent-attest.service
After=vm-agent-attest.service
