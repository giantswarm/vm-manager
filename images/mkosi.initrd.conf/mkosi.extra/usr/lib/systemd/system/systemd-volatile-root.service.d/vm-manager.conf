# The installer boot (phase A, vm.install-target credential present) copies
# the running root, verity and signature partitions to the target with
# CopyBlocks=auto, which systemd-repart resolves from the block device behind
# /usr. Under systemd.volatile=overlay that is an overlayfs without a block
# device ("Failed to resolve automatic CopyBlocks= path for partition type
# root"), so the installer boot runs on the plain read-only verity root
# instead. Every other boot keeps the overlay from the kernel command line.
[Unit]
ConditionCredential=!vm.install-target
