# giantswarm-vm-base: Arch, systemd 261, erofs root with signed dm-verity,
# UKI with signed expected PCR 11, booted by systemd-boot.
#
# This is the "main" mkosi image (Format=disk). The OS tree itself is built by
# the subimage mkosi.images/base/ (Format=directory) and pulled in through
# BaseTrees=; mkosi.images/kubernetes/ (Format=sysext, Overlay=yes) packs the
# Kubernetes node stack as a system extension on top of the same tree.

[Distribution]
Distribution=arch

[Config]
# `mkosi build` builds the base tree and the disk image. The kubernetes sysext
# is added with --dependency=kubernetes (CLI values append to this list); see
# the Makefile targets images and kubernetes.
Dependencies=base

[Output]
Format=disk
ImageId=giantswarm-vm-base
OutputDirectory=build
# uki, roothash and per-partition files are the sysupdate/attestation
# artifacts; repart-definitions documents the layout that was used. (mkosi 27
# writes no "pcrs" JSON for locally built UKIs; scripts/verify recomputes the
# expected PCR 11 values with systemd-measure instead.)
SplitArtifacts=uki,initrd,roothash,partitions,repart-definitions
# Fixed seed: reproducible partition UUIDs for ESP and disk. Root and verity
# partition UUIDs are derived from the verity root hash by systemd-repart.
Seed=4f0e6a1c-2b7d-4c8e-9a3f-5d6e7f8a9b0c

[Build]
CacheDirectory=mkosi.cache
Incremental=yes
RepartOffline=yes

[Content]
BaseTrees=%O/base
Bootable=yes
Bootloader=systemd-boot
# "unsigned" = build the UKI here with ukify ("signed" would look for a
# distro-prebuilt UKI). It is still PCR-signed via SignExpectedPcr=.
UnifiedKernelImages=unsigned
# EFI/Linux/giantswarm-vm-base_<version>.efi, the name sysupdate.d/70-uki
# expects to find and replace on the installed ESP.
UnifiedKernelImageFormat=%i_%v
# Default mkosi initrd plus the network profile (systemd-networkd, resolved,
# systemd-imdsd) and our additions from mkosi.initrd.conf/.
InitrdProfiles=network
# Kernel modules appended to the initrd (the default is every module of the
# kernel, 150 MB). Only what a vm-manager guest needs to reach the verity
# root and the IMDS; everything else is loaded from the root file system.
KernelInitrdModules=
        virtio_pci virtio_mmio virtio_blk virtio_scsi virtio_net virtio_console virtio_balloon virtio-rng
        vsock vmw_vsock_virtio_transport
        sd_mod scsi_mod nvme
        erofs dm-mod dm-verity overlay ext4 vfat /fs/nls/ loop autofs4 configfs efivarfs efi-pstore
        tpm_tis tpm_crb
        qemu_fw_cfg dmi-sysfs
        crypto/sha256* crypto/sha512* crypto/crc32* crypto/xxhash*
# roothash= is appended by mkosi. The root stays the read-only verity erofs;
# /etc, /root and /opt are made writable and persistent on the var partition
# by the initrd (mkosi.initrd.conf/, persistent-etc.service), so
# systemd-firstboot and credential-driven provisioning work and survive
# reboots. systemd.imds.import=yes imports IMDS credentials in the host
# system too (the default is initrd-only). systemd.firstboot=off only disables
# interactive prompts, credentials are still applied. ignition.config.url
# points Ignition's cmdline provider at the IMDS user-data key;
# ignition.platform.id names the platform for tooling (the initrd units pass
# --platform=metal themselves). ignition.firstboot is not here: vm-manager
# adds it through the stub's kernel-cmdline-extra SMBIOS string on the first
# installed boot only, which is what makes the ignition-* units run.
KernelCommandLine=console=ttyS0,115200 systemd.imds.import=yes systemd.firstboot=off ignition.platform.id=metal ignition.config.url=http://169.254.169.254/giantswarm/v1/user-data
Locale=C.UTF-8
Keymap=us
Timezone=UTC
CleanPackageMetadata=yes
# The var partition is mounted over /var in the initrd; keep the directory
# empty so that nothing is hidden under the mount and systemd-gpt-auto-
# generator's rule (var only over an empty /var) holds too. Packages leave
# directories and a few files there; systemd-tmpfiles recreates what is
# needed on the mounted var (tmpfiles.d/vm-manager.conf covers what the
# systemd catalog does not).
RemoveFiles=/var/*

[Validation]
Verity=signed
VerityKey=keys/verity.key
VerityCertificate=keys/verity.crt
SignExpectedPcr=yes
SignExpectedPcrKey=keys/pcr.key
SignExpectedPcrCertificate=keys/pcr.crt

[Runtime]
# `mkosi vm`: boot a throw-away copy, grown so repart can create var.
Ephemeral=yes
RuntimeSize=8G
TPM=yes
Firmware=uefi
RAM=2G
