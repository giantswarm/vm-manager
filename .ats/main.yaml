# app-test-suite (ATS >= 1.0) config, consumed by the generated
# `run-tests-with-ats` CircleCI job (execute-chart-tests). The job creates a
# kind cluster; ATS applies the CRDs listed below, installs the packaged chart
# with `helm upgrade --install --wait` (tests/test-values.yaml, the namespace
# below) and runs `pytest -m smoke` in tests/ats.
#
# The smoke (tests/ats/test_smoke.py) is the chart-level install check: the
# chart installs on a bare cluster and its Deployment becomes ready with the
# image the branch build pushed (branchPublish in giantswarm/github makes
# execute-chart-tests wait on that push; the chart resolves the image tag from
# the stamped appVersion). The guest image fetch is off there
# (tests/test-values.yaml): a branch publishes no guest image artifact, only a
# release does (.circleci/custom.yml). The pod runs privileged on the kind
# node; whether the node has KVM is not the smoke's question. What the chart
# does on a KVM node with the platform's identity — the fetched image, a VM
# booted and attested — is proven in agentlab (docs/development.md).
app-tests-app-config-file: tests/test-values.yaml
app-tests-deploy-namespace: agent-platform

# ATS's bundled CRDs only: the chart renders no CR by default (the muster
# MCPServer is behind muster.mcpServer.enabled, off here).
cluster-crds: /etc/ats/crds

# functional: no second scenario. upgrade: an upgrade from the last release in
# the catalog is a follow-up.
skip-steps: [functional, upgrade]
