name: image

# T2 of docs/design.md "Testing strategy": build the guest image and the
# kubernetes sysext with mkosi and run the offline verification, then publish
# images/build/ as the `guest-image` artifact that e2e.yml boots.
#
# The build runs inside an archlinux container: the image is Arch (mkosi 27,
# systemd 261, erofs-utils, ukify, systemd-measure), the hosted Ubuntu runner
# has none of that at the needed versions, and images/README.md documents
# the Arch host. --privileged is what mkosi's sandbox needs for its mount
# namespaces and the sysext's overlayfs; the mkosi workspace lives on the
# runner's bind-mounted temp directory because overlayfs cannot stack on the
# container's own overlay root.
#
# No mkosi cache survives the job: every build installs the current Arch
# repositories, as the release's CircleCI guest-image job does
# (.circleci/custom.yml), so a nightly or a PR touching the image inputs boots
# the package set a release built at the same time ships. A cache restored
# with valid incremental trees and cache manifests would make mkosi skip the
# metadata sync and copy the cached trees, freezing the package set of the
# build that seeded it. Within the job the incremental cache keeps the second
# mkosi run (the other KUBERNETES_VERSIONS) on the first one's metadata and
# base tree.

# Triggered only through e2e.yml (workflow_call, whenever a change touches the
# image inputs) or by hand: a standalone pull_request/push trigger here would
# build the same commit a second time next to the nested build.
on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# Distinct from the caller's group (e2e.yml calls this workflow): a called
# workflow sharing its caller's concurrency group would deadlock or cancel it.
concurrency:
  group: image-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # What e2e.yml downloads. Keep in sync with e2e.yml.
  ARTIFACT: guest-image

jobs:
  build:
    name: mkosi build and verify
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    container:
      image: archlinux:latest
      options: --privileged
    steps:
      - name: git for the checkout
        # Before the checkout: without git, actions/checkout downloads a
        # tarball with no .git, and Make's rev-parse and Go's VCS stamping of
        # vm-agent need one.
        run: |
          pacman-key --init
          pacman -Syu --noconfirm --needed git

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the Arch build tools
        # The one list images/README.md documents for the host, shared with
        # hack/guest-image-build.sh (the CircleCI guest-image job).
        run: images/scripts/install-build-deps

      - name: Build keys, base image and every kubernetes sysext version; verify
        # `make -C images` (all): keys, one mkosi run for base tree, disk
        # image and the default sysext, the other KUBERNETES_VERSIONS, then
        # verify-base and verify-kubernetes (which covers every published
        # version). The bind-mounted checkout belongs to the runner user, the
        # container runs as root: without safe.directory, git (Make's
        # rev-parse, Go's VCS stamping of vm-agent) refuses it with "dubious
        # ownership".
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git rev-parse --short HEAD
          mkdir -p "$RUNNER_TEMP/mkosi"
          make -C images MKOSI="mkosi --workspace-dir=$RUNNER_TEMP/mkosi" all

      - name: Job summary (sizes, PCR 11)
        run: |
          {
            echo "## guest-image"
            echo
            echo "mkosi $(mkosi --version | awk '{print $2}'), $(systemctl --version | head -1), $(go version | cut -d' ' -f3)"
            echo
            echo '```'
            (cd images/build && ls -lh -- *.efi *.raw *.roothash policy.json && du -sh sysupdate/*)
            echo '```'
            echo
            echo "### Expected PCR 11 (policy.json)"
            echo
            echo "| phase path | sha256 |"
            echo "|---|---|"
            python3 -c 'import json; [print(f"| `{k}` | `{v}` |") for k, v in json.load(open("images/build/policy.json"))["pcr11"].items()]'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the image artifact
        # The build tree (base/), Ignition sources and the .initrd (inside the
        # UKI) stay out; the rest is what vm-manager serve and the e2e tests
        # read. Already compressed (erofs zstd), so no zip compression.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.ARTIFACT }}
          path: |
            images/build/*.efi
            images/build/*.raw
            images/build/*.roothash
            images/build/*.repart.d/
            images/build/policy.json
            images/build/sysupdate/
          if-no-files-found: error
          compression-level: 0
          # Long enough for e2e.yml to reuse main's image between merges.
          retention-days: ${{ github.event_name == 'push' && 30 || 7 }}
