name: chart

# The offline chart checks on every change: the chart lints and its render
# assertions hold (hack/verify-chart.sh — the rules the templates encode that
# helm lint and the values schema cannot check). values.schema.json and the
# chart README are kept current by the generated pre-commit hooks; the install
# smoke is the ATS job of the generated CircleCI pipeline
# (execute-chart-tests, .ats/main.yaml); what the chart does on a KVM node with
# the platform's identity is proven in agentlab (docs/development.md).

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: lint and render assertions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v3.22.0
      - run: make helm-lint
      - run: make helm-verify
