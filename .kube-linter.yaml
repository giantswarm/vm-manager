# kube-linter runs on the chart in app-build-suite (the generated CircleCI
# build-chart job). Every exclusion below is a defence the pod's shape
# cannot satisfy, said why; keep the list to those.
checks:
  exclude:
    # The pod is a KVM node's: the container runtime hands a privileged
    # container the node's /dev/kvm and /dev/vhost-vsock with the device
    # cgroup open. Nothing else of the privilege is used (userspace
    # networks, no CAP_NET_ADMIN); a device plugin handing out the two
    # devices to an unprivileged pod is the refinement.
    - privileged-container
    - privilege-escalation-container
    # Root, on purpose: /dev/kvm is root:kvm on every node, QEMU and swtpm
    # are the process's children, and the init container writes the state
    # volume the server (root) reads.
    - run-as-non-root
    # QEMU and swtpm write under the state directory and /tmp (an emptyDir)
    # — a read-only root file system for the server is a follow-up once the
    # runtime's own writes are mapped; the init container already has one.
    - no-read-only-root-fs
    # The VMs are QEMU processes inside the server container, so a memory
    # limit bounds the sum of their memory: the chart sets requests only and
    # leaves the limit to the installation (values.yaml, resources). The
    # init container streams the guest image to the volume, so its memory is
    # the page cache of what it writes; a limit there OOM-kills a pull from a
    # fast registry, so it carries none either (guestImage.resources).
    - unset-memory-requirements
